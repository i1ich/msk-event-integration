name: Deploy to AWS

# Manual only. Costs money while the stack is up: run "teardown" the same day.
# Auth: GitHub OIDC -> role in repo variable AWS_DEPLOY_ROLE_ARN (created by infra/cloudformation/github-oidc.yaml).
# The role trusts environment "aws" on refs/heads/main. No long-lived AWS keys are used anywhere.
# The budget stack (msk-ei-budget) must exist: scripts/create-budget.sh. The budget check stays ON in CI.

on:
  workflow_dispatch:
    inputs:
      env:
        description: Environment name (stack prefix)
        required: true
        default: dev
        type: string
      action:
        description: What to run
        required: true
        default: deploy
        type: choice
        options: [deploy, teardown, smoke]
      cluster_type:
        description: MSK cluster type (serverless is not available in sa-east-1)
        required: true
        default: provisioned
        type: choice
        options: [provisioned, serverless]
      region:
        description: AWS region (empty = repo variable AWS_REGION, else sa-east-1)
        required: false
        default: ''
        type: string

permissions:
  id-token: write
  contents: read

concurrency:
  group: aws-${{ inputs.env }}
  cancel-in-progress: false

jobs:
  run:
    name: ${{ inputs.action }} (${{ inputs.env }})
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: aws
    timeout-minutes: 120
    env:
      ENV_NAME: ${{ inputs.env }}
      ACTION: ${{ inputs.action }}
      CLUSTER_TYPE: ${{ inputs.cluster_type }}
      AWS_REGION: ${{ inputs.region || vars.AWS_REGION || 'sa-east-1' }}
      ALERT_EMAIL: ${{ vars.ALERT_EMAIL }}
    steps:
      - name: Validate inputs
        shell: bash
        run: |
          [[ "$ENV_NAME" =~ ^[a-z][a-z0-9-]{1,15}$ ]] || { echo "invalid env name"; exit 1; }
          [[ "$AWS_REGION" =~ ^[a-z]{2}-[a-z]+-[0-9]$ ]] || { echo "invalid region"; exit 1; }

      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - uses: docker/setup-buildx-action@v3

      - name: Deploy
        if: env.ACTION == 'deploy'
        shell: bash
        run: bash scripts/deploy.sh "$ENV_NAME" --yes --cluster-type "$CLUSTER_TYPE"

      - name: Smoke test
        if: env.ACTION == 'smoke'
        shell: bash
        run: bash scripts/smoke-test.sh "$ENV_NAME"

      - name: Teardown
        if: env.ACTION == 'teardown'
        shell: bash
        run: bash scripts/teardown.sh "$ENV_NAME" --yes
