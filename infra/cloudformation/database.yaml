AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  msk-event-integration - RDS PostgreSQL 16 (db.t4g.micro, single-AZ) with logical replication for Debezium,
  its generated credentials secret, and a custom resource that applies infra/postgres/init/01-schema.sql.

Parameters:
  EnvName:
    Type: String
    Default: dev
    AllowedPattern: '[a-z][a-z0-9-]{1,15}'
    Description: Environment name; prefix of every stack, resource and export.
  EngineVersion:
    Type: String
    Default: '16'
    Description: PostgreSQL 16 minor version. Must exist in the target region (aws rds describe-db-engine-versions).
  DbInstanceClass:
    Type: String
    Default: db.t4g.micro
  BootstrapArtifactKey:
    Type: String
    MinLength: 1
    Description: S3 key of the infra-bootstrap jar in the artifacts bucket, e.g. lambda/infra-bootstrap-<gitsha>.jar.
  SchemaVersion:
    Type: String
    Default: '1'
    Description: Change this value to make CloudFormation re-run the DbInit custom resource on a stack update.

Resources:
  # Password is generated by Secrets Manager and never appears in the repo or in template parameters.
  # No explicit secret Name on purpose: a deleted secret with a fixed name stays "scheduled for deletion" and blocks
  # re-creating it with the same name after teardown. The generated name still contains "-msk-ei-".
  DbSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: !Sub 'Credentials of the ${EnvName} ERP database (user erp).'
      GenerateSecretString:
        SecretStringTemplate: '{"username":"erp"}'
        GenerateStringKey: password
        PasswordLength: 24
        # Alphanumeric only: nothing that needs escaping in JDBC URLs, connection strings or shell.
        ExcludePunctuation: true
      Tags:
        - { Key: Project, Value: msk-event-integration }
        - { Key: Env, Value: !Ref EnvName }

  DbSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Private subnets for the ERP database.
      SubnetIds:
        - !ImportValue
          Fn::Sub: '${EnvName}-msk-ei-PrivateSubnet1'
        - !ImportValue
          Fn::Sub: '${EnvName}-msk-ei-PrivateSubnet2'
      Tags:
        - { Key: Project, Value: msk-event-integration }
        - { Key: Env, Value: !Ref EnvName }

  # Debezium reads the WAL through a logical replication slot (pgoutput); this static parameter turns on
  # wal_level=logical. It is applied at first boot, so no reboot is needed.
  DbParameterGroup:
    Type: AWS::RDS::DBParameterGroup
    Properties:
      Description: PostgreSQL 16 with logical replication for Debezium.
      Family: postgres16
      Parameters:
        rds.logical_replication: '1'
      Tags:
        - { Key: Project, Value: msk-event-integration }
        - { Key: Env, Value: !Ref EnvName }

  # Nothing is retained: teardown must leave no cost behind (no final snapshot, no kept backups).
  DbInstance:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      DBInstanceIdentifier: !Sub '${EnvName}-msk-ei-db'
      Engine: postgres
      EngineVersion: !Ref EngineVersion
      DBInstanceClass: !Ref DbInstanceClass
      AllocatedStorage: '20'
      StorageType: gp3
      StorageEncrypted: true
      MultiAZ: false
      DBName: erp
      MasterUsername: erp
      MasterUserPassword: !Sub '{{resolve:secretsmanager:${DbSecret}:SecretString:password}}'
      DBSubnetGroupName: !Ref DbSubnetGroup
      DBParameterGroupName: !Ref DbParameterGroup
      VPCSecurityGroups:
        - !ImportValue
          Fn::Sub: '${EnvName}-msk-ei-DbSecurityGroup'
      PubliclyAccessible: false
      DeletionProtection: false
      # 1 day, not 0: with 0 RDS disables automated backups, and the WAL/PITR machinery that logical
      # replication slots coexist with is documented around backup-enabled instances (retention 0 also
      # blocks read replicas). 1 day on 20 GiB stays inside the free backup allowance, and
      # DeleteAutomatedBackups removes them with the instance, so nothing outlives teardown.
      BackupRetentionPeriod: 1
      DeleteAutomatedBackups: true
      CopyTagsToSnapshot: false
      AutoMinorVersionUpgrade: false
      Tags:
        - { Key: Project, Value: msk-event-integration }
        - { Key: Env, Value: !Ref EnvName }

  # Adds host, port, engine and dbInstanceIdentifier to the secret JSON.
  DbSecretAttachment:
    Type: AWS::SecretsManager::SecretTargetAttachment
    Properties:
      SecretId: !Ref DbSecret
      TargetId: !Ref DbInstance
      TargetType: AWS::RDS::DBInstance

  # --- DbInit: applies infra/postgres/init/01-schema.sql (bundled in the jar) --------------------------------------
  # Why a custom resource: the database is private, so SQL can only run from inside the VPC; a Lambda in the
  # private subnets with the client security group (allowed on 5432) is the cheapest way to do it from CloudFormation.
  # The same function is invoked by the smoke test with {"action":"smoke-order"}.
  DbInitLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${EnvName}-msk-ei-dbinit'
      RetentionInDays: 7
      Tags:
        - { Key: Project, Value: msk-event-integration }
        - { Key: Env, Value: !Ref EnvName }

  DbInitRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole'
      Policies:
        - PolicyName: read-db-secret
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref DbSecret
      Tags:
        - { Key: Project, Value: msk-event-integration }
        - { Key: Env, Value: !Ref EnvName }

  DbInitFunction:
    Type: AWS::Lambda::Function
    DependsOn: DbInitLogGroup
    Properties:
      FunctionName: !Sub '${EnvName}-msk-ei-dbinit'
      Runtime: java21
      Handler: io.github.i1ich.mskei.bootstrap.DbInitHandler::handleRequest
      Code:
        S3Bucket: !ImportValue
          Fn::Sub: '${EnvName}-msk-ei-ArtifactsBucket'
        S3Key: !Ref BootstrapArtifactKey
      Role: !GetAtt DbInitRole.Arn
      Timeout: 300
      MemorySize: 512
      Environment:
        Variables:
          DB_HOST: !GetAtt DbInstance.Endpoint.Address
          DB_NAME: erp
          DB_SECRET_ARN: !Ref DbSecret
      VpcConfig:
        SubnetIds:
          - !ImportValue
            Fn::Sub: '${EnvName}-msk-ei-PrivateSubnet1'
          - !ImportValue
            Fn::Sub: '${EnvName}-msk-ei-PrivateSubnet2'
        SecurityGroupIds:
          - !ImportValue
            Fn::Sub: '${EnvName}-msk-ei-ClientSecurityGroup'
      Tags:
        - { Key: Project, Value: msk-event-integration }
        - { Key: Env, Value: !Ref EnvName }

  DbInit:
    Type: Custom::DbInit
    DependsOn:
      - DbInstance
      - DbSecretAttachment
    Properties:
      ServiceToken: !GetAtt DbInitFunction.Arn
      Version: !Ref SchemaVersion

Outputs:
  DbEndpoint:
    Description: Database host name.
    Value: !GetAtt DbInstance.Endpoint.Address
    Export:
      Name: !Sub '${EnvName}-msk-ei-DbEndpoint'
  DbSecretArn:
    Value: !Ref DbSecret
    Export:
      Name: !Sub '${EnvName}-msk-ei-DbSecretArn'
  DbInitFunctionName:
    Description: Used by the smoke test (action smoke-order).
    Value: !Ref DbInitFunction
    Export:
      Name: !Sub '${EnvName}-msk-ei-DbInitFunctionName'
