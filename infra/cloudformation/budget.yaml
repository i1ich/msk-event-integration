AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  msk-event-integration - account-level AWS Budgets: a monthly cost limit and a daily one, both with e-mail alerts.
  Budgets only alert; they never stop resources. The daily budget catches a forgotten stack within the same day.
  Deploy FIRST and only once per account; it is not tied to an environment and is kept by teardown.

Parameters:
  MonthlyLimitUsd:
    Type: Number
    Default: 15
    MinValue: 1
    Description: Monthly cost limit in USD.
  DailyLimitUsd:
    Type: Number
    Default: 3
    MinValue: 1
    Description: >-
      Daily cost limit in USD. The full stack costs about 0.55 USD/h (docs/cost.md), so 3 USD is reached after
      roughly 5-6 hours of running: a forgotten deployment triggers an e-mail the same day.
  AlertEmail:
    Type: String
    AllowedPattern: '^[^@\s]+@[^@\s]+\.[^@\s]+$'
    ConstraintDescription: Must be an e-mail address.
    Description: Address that receives the budget alerts (supplied at deploy time, never committed).

Resources:
  MonthlyCostBudget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: msk-ei-monthly-cost
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit:
          Amount: !Ref MonthlyLimitUsd
          Unit: USD
      NotificationsWithSubscribers:
        # Early warning: real spend crossed 80% of the limit.
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 80
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref AlertEmail
        # The forecast says the month will end above the limit (fires before the money is spent).
        - Notification:
            NotificationType: FORECASTED
            ComparisonOperator: GREATER_THAN
            Threshold: 100
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref AlertEmail

  DailyCostBudget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: msk-ei-daily-cost
        BudgetType: COST
        TimeUnit: DAILY
        BudgetLimit:
          Amount: !Ref DailyLimitUsd
          Unit: USD
      NotificationsWithSubscribers:
        # Daily budgets support ACTUAL notifications only (no forecast). Billing data lags by several hours,
        # so this is a same-day safety net, not a real-time limit.
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 100
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref AlertEmail
