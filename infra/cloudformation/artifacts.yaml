AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  msk-event-integration - S3 bucket for Lambda jars and the Kafka Connect plugin zip.

Parameters:
  EnvName:
    Type: String
    Default: dev
    AllowedPattern: '[a-z][a-z0-9-]{1,15}'
    Description: Environment name; prefix of every stack, resource and export.

Resources:
  # The bucket name is generated by CloudFormation (<stack>-artifactsbucket-<random>): globally unique without
  # hard-coding an account ID, and it still contains "-msk-ei-" so the deploy role can be scoped to it.
  # Versioning is off: deleting objects really deletes them. The stack cannot delete a non-empty bucket, so
  # teardown empties it first (scripts/teardown.sh).
  ArtifactsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      Tags:
        - { Key: Project, Value: msk-event-integration }
        - { Key: Env, Value: !Ref EnvName }

  # Refuse plain-HTTP access.
  ArtifactsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ArtifactsBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource:
              - !GetAtt ArtifactsBucket.Arn
              - !Sub '${ArtifactsBucket.Arn}/*'
            Condition:
              Bool:
                'aws:SecureTransport': 'false'

Outputs:
  ArtifactsBucket:
    Description: Bucket holding lambda/*.jar and connect/*.zip.
    Value: !Ref ArtifactsBucket
    Export:
      Name: !Sub '${EnvName}-msk-ei-ArtifactsBucket'
